services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      YGGVION_PAIRING_KEY: ${YGGVION_PAIRING_KEY:?Set a random pairing key of at least 32 characters}
    volumes:
      - app_data:/data
    expose:
      - "8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      YGGVION_DOMAIN: ${YGGVION_DOMAIN:?Set the public domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  app_data:
  caddy_data:
  caddy_config:
