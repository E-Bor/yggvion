openapi: 3.1.0
info:
  title: Yggvion personal sync API
  version: 3.0.0
  description: >-
    One owner, device tokens, optimistic record versions. UTC RFC3339 timestamps;
    IANA timezone retained on blocks/series. Mutations in a batch are atomic.
    Version conflicts are returned per record without overwriting either side.
    Protocol 5 clients initialize password-protected E2EE before the first upload, encrypt Record.data
    and attachments on-device, and read /state before pushing. Keys never reach
    the server in plaintext. Only an authenticated password wrapping of the random
    workspace key is stored on the server. Private record IDs are keyed HMAC identifiers. Clients send X-Yggvion-Generation
    on sync, changes and attachment requests. Missing or stale generations return
    409 generation_changed. Clients quarantine local records/outbox/conflicts,
    reset the cursor and fetch the restored dataset before sending new writes.
servers:
  - url: https://planner.example.com/api/v1
security:
  - deviceToken: []
paths:
  /encryption:
    post:
      summary: Initialize an empty workspace with a key fingerprint and password wrapping
      description: Idempotent for the same fingerprint. Refuses a different key or an existing plaintext dataset. No old-client migration is provided.
      parameters: [{$ref: '#/components/parameters/Generation'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key_id, password_envelope]
              properties:
                key_id: {type: string, pattern: '^[a-f0-9]{64}$'}
                password_envelope: {$ref: '#/components/schemas/PasswordEnvelope'}
      responses:
        '200': {description: Fingerprint installed or already identical}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /encryption/password:
    put:
      summary: Replace the password wrapping without re-encrypting personal records
      description: Compare-and-swap on expected_revision. The next revision must equal expected_revision + 1. An identical successful retry is accepted; a concurrent different change returns 409 password_changed. Passwords and derived password keys are never sent. A current generation header is always required, including before the first restore.
      parameters:
        - in: header
          name: X-Yggvion-Generation
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key_id, expected_revision, password_envelope]
              properties:
                key_id: {type: string, pattern: '^[a-f0-9]{64}$'}
                expected_revision: {type: integer, minimum: 1, maximum: 2147483646}
                password_envelope: {$ref: '#/components/schemas/PasswordEnvelope'}
      responses:
        '200':
          description: Wrapping stored or retry already applied
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: {type: integer, minimum: 1, maximum: 2147483647}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /guest-proposals:
    get:
      summary: Receive up to 100 unencrypted guest proposals for client validation and encryption
      description: Proposals are held separately from personal records. A successful encrypted mutation with the same guest_ ID acknowledges and deletes the inbox item. Expiry of a share does not delete received proposals.
      parameters: [{$ref: '#/components/parameters/Generation'}]
      responses:
        '200':
          description: Pending guest input; never treat this input as an authenticated personal record
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, pattern: '^guest_[a-f0-9]{64}$'}
                        kind: {const: task}
                        version: {const: 0}
                        deleted: {const: false}
                        seq: {const: 0}
                        data: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Error'}
  /calendar-shares/{id}/availability:
    put:
      summary: Refresh a published anonymous availability snapshot from an owner device
      parameters:
        - {$ref: '#/components/parameters/Generation'}
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Availability'}
      responses:
        '200': {description: Replaced within the original share window; expiry is unchanged}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /calendar-shares:
    get:
      summary: List active share windows without secrets, for snapshot refresh
      parameters: [{$ref: '#/components/parameters/Generation'}]
      responses:
        '200': {description: 'shares array with id, expires, start, end, timezone'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      summary: Share anonymous availability for exactly one hour
      description: >-
        Owner only. Maximum 20 live invitations. Returns a 256-bit secret once in
        the URL fragment; only its SHA-256 hash is stored. Initial public HTTPS
        certificate issuance can take up to two minutes.
      parameters:
        - {$ref: '#/components/parameters/Generation'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days, snapshot]
              properties:
                days: {type: integer, minimum: 1, maximum: 30}
                snapshot: {$ref: '#/components/schemas/Availability'}
      responses:
        '201':
          description: N days starting today in the owner's timezone
          content:
            application/json:
              schema:
                type: object
                required: [id, url, expires, start, end, timezone]
                properties:
                  id: {type: string}
                  url: {type: string, format: uri}
                  expires: {type: string, format: date-time}
                  start: {type: string, format: date-time}
                  end: {type: string, format: date-time}
                  timezone: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /calendar-shares/{id}:
    delete:
      summary: Revoke an invitation immediately; previously received tasks are preserved
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Revoked}
        '401': {$ref: '#/components/responses/Error'}
  /public/calendar:
    servers: [{url: 'https://planner.example.com'}]
    get:
      summary: Anonymous busy intervals with overlaps and adjacent intervals merged
      description: >-
        Send the share secret from the URL fragment as a Bearer token. No titles,
        descriptions, IDs, projects, birthdays or pending suggestions are disclosed.
        Responses are not cached. Revoking the issuing device or restoring server
        data also invalidates invitations.
      security: [{calendarShare: []}]
      responses:
        '200':
          description: UTC boundaries, rendered in the guest's local timezone
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [expires, start, end, timezone, busy, now]
                properties:
                  expires: {type: string, format: date-time}
                  start: {type: string, format: date-time}
                  end: {type: string, format: date-time}
                  now: {type: string, format: date-time}
                  timezone: {type: string}
                  busy:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [start, end]
                      properties:
                        start: {type: string, format: date-time}
                        end: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/proposals:
    servers: [{url: 'https://planner.example.com'}]
    post:
      summary: Suggest a one-time event without reserving its time
      description: >-
        At most 10 proposals per invitation. Start must be in the future, within
        the shared window and currently free. Minute precision, duration at most
        24 hours. Repeating a nonce with identical content is idempotent; changed
        content is rejected. Maximum JSON body 16 KiB, description 8000 UTF-8 bytes.
        The plaintext suggestion is held in a separate inbox until an owner client
        validates it and uploads an encrypted task without a calendar block.
      security: [{calendarShare: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nonce, title, start, end]
              properties:
                nonce: {type: string, pattern: '^[a-zA-Z0-9_-]{1,160}$'}
                title: {type: string, minLength: 1, maxLength: 200}
                description: {type: string, description: Text or Markdown}
                start: {type: string, format: date-time}
                end: {type: string, format: date-time}
      responses:
        '201': {description: Created or identical retry; returns only proposed=true}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /state:
    get:
      summary: Server generation and supported administrative capabilities
      responses:
        '200':
          description: Read before each sync cycle
          content:
            application/json:
              schema:
                type: object
                required: [generation, protocol, private_ca, backups]
                properties:
                  generation: {type: string}
                  protocol: {type: integer, const: 5}
                  e2ee: {type: boolean, const: true}
                  encryption_key_id: {type: string, description: Empty before initial setup; otherwise SHA256 of the random workspace key}
                  password_envelope:
                    oneOf:
                      - {$ref: '#/components/schemas/PasswordEnvelope'}
                      - {type: 'null'}
                    description: Authenticated devices fetch this public wrapping and unlock on-device. Null before setup. Restoring a snapshot of the same workspace preserves its current wrapping.
                  snapshot_created: {type: string, description: Snapshot timestamp after restore; client closes restored running timers at this instant}
                  snapshot_cursor: {type: integer, format: int64, description: Last restored record sequence; only running sessions with a positive sequence at or below this boundary are closed at snapshot_created. Later sessions remain active.}
                  generation_reason: {type: string}
                  private_ca: {type: string, description: 'Public PEM CA, empty for public HTTPS'}
                  backups: {type: boolean}
                  server_schema: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
  /metrics:
    get:
      summary: On-demand Linux VPS resource snapshot, cached for 30 seconds
      description: Authenticated. CPU is the host busy percentage over a short sample. Memory excludes available cache; disk refers to the data filesystem. No background sampler.
      responses:
        '200':
          description: Current or cached sample; null CPU means no measurable tick delta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerMetrics'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /invitations:
    post:
      summary: Create a single-use invitation valid for ten minutes
      description: Revoking the issuing device invalidates its unused invitations. Maximum 32 live invitations. Protocol 5 connection links contain exactly version (1), url, code, ca and expires_at; a newly connected device enters the encryption password to unlock /state.password_envelope locally. Previous link formats are rejected.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Transfer code and CA only via a trusted QR/link channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string}
                  expires_at: {type: string, format: date-time}
                  private_ca: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /backups:
    get:
      summary: List encrypted local backups, schedule and current background job
      responses:
        '200':
          description: Secrets are omitted from remote configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups: {type: array, items: {$ref: '#/components/schemas/Backup'}}
                  config: {$ref: '#/components/schemas/BackupConfig'}
                  remote: {$ref: '#/components/schemas/BackupRemote'}
                  status:
                    type: object
                    properties:
                      running: {type: boolean}
                      operation: {type: string}
                      error: {type: string}
                      finished: {type: [string, 'null'], format: date-time}
        '401': {$ref: '#/components/responses/Error'}
    post:
      summary: Start an encrypted user-data and attachments snapshot; replicate if configured
      description: Requires a configured password-protected workspace. Snapshot format 2 contains an obligatory password_envelope, encryption_key_id, encrypted records and encrypted attachments. Plaintext snapshots, format 1 and key-only archives are unsupported. The age outer archive layer is independent of the on-device encryption password.
      responses:
        '202': {description: Job accepted; poll GET /backups for completion}
        '409': {$ref: '#/components/responses/Error'}
  /backups/config:
    put:
      summary: Set backup frequency and local retention
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupConfig'}
      responses:
        '200': {description: Configuration saved}
        '400': {$ref: '#/components/responses/Error'}
  /backups/recovery-key:
    get:
      summary: Explicit authenticated export of the private age recovery key
      responses:
        '200':
          description: Store outside this VPS; never include in a backup archive or log
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /backups/{id}/download:
    parameters:
      - {$ref: '#/components/parameters/BackupID'}
    get:
      summary: Stream encrypted archive, independent of the attachment size limit
      responses:
        '200':
          description: Portable age-encrypted .yggbackup file
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Error'}
  /backups/{id}:
    parameters:
      - {$ref: '#/components/parameters/BackupID'}
    delete:
      summary: Delete one local backup; external copies remain
      responses:
        '202': {description: Deletion job accepted}
        '409': {$ref: '#/components/responses/Error'}
  /backups/{id}/restore:
    parameters:
      - {$ref: '#/components/parameters/BackupID'}
    post:
      summary: Validate, create safety backup, atomically replace user records and rotate generation
      description: Authentication, revoked devices and TLS identity survive. Running sessions close at backup creation time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: {type: string, const: restore}
      responses:
        '202': {description: Restore job accepted}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /backups/import:
    post:
      summary: Stream, validate and re-encrypt an archive under this server's recovery key
      description: Maximum 100 GiB encrypted body. Imported copies do not replace current data until explicitly restored.
      parameters:
        - in: header
          name: X-Yggvion-Recovery-Key
          required: true
          schema: {type: string, writeOnly: true}
      requestBody:
        required: true
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        '202': {description: Validation/import job accepted after upload}
        '413': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /backups/remote:
    get:
      summary: List encrypted copies in the configured S3/SFTP destination
      responses:
        '200':
          description: External copies
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups: {type: array, items: {$ref: '#/components/schemas/Backup'}}
        '502': {$ref: '#/components/responses/Error'}
    put:
      summary: Validate remote credentials and enable automatic encrypted replication
      description: Empty secrets preserve existing credentials only for an unchanged destination/user. HTTPS is required for S3; SFTP requires the exact SHA256 SSH fingerprint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupRemote'}
      responses:
        '200': {description: Destination checked and stored with mode 0600}
        '400': {$ref: '#/components/responses/Error'}
  /backups/remote/{id}/fetch:
    parameters:
      - {$ref: '#/components/parameters/BackupID'}
    post:
      summary: Retrieve, validate and import an external archive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {type: string, writeOnly: true, description: Empty uses current server key}
      responses:
        '202': {description: Fetch job accepted}
        '409': {$ref: '#/components/responses/Error'}
  /pair:
    post:
      security: []
      summary: Exchange a single-use invitation or explicitly configured bootstrap key for a device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, key]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                key: {type: string, minLength: 32, writeOnly: true}
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                type: object
                required: [device_id, token, protocol]
                properties:
                  device_id: {type: string}
                  token: {type: string}
                  protocol: {type: integer, const: 5}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /sync:
    parameters:
      - {$ref: '#/components/parameters/Generation'}
    post:
      summary: Apply 1–100 encrypted mutations with idempotent operation IDs (maximum 8 MiB request)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutations]
              properties:
                mutations:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [operation_id, record]
                    properties:
                      operation_id: {type: string}
                      record: {$ref: '#/components/schemas/Record'}
      responses:
        '200':
          description: Versioned results; retry an identical operation to get its original result
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [operation_id, status, record]
                      properties:
                        operation_id: {type: string}
                        status: {type: string, enum: [applied, conflict]}
                        record: {$ref: '#/components/schemas/Record'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /changes:
    parameters:
      - {$ref: '#/components/parameters/Generation'}
    get:
      summary: Read up to 500 ordered changes including tombstones
      parameters:
        - in: query
          name: after
          schema: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        '200':
          description: Persist cursor only after applying all records in this page
          content:
            application/json:
              schema:
                type: object
                required: [records, cursor, has_more]
                properties:
                  records: {type: array, items: {$ref: '#/components/schemas/Record'}}
                  cursor: {type: integer, format: int64}
                  has_more: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /events:
    get:
      summary: SSE sync hints; clients must retrieve durable changes using their cursor
      responses:
        '200':
          description: An event named sync on changes and every 20 seconds
          content:
            text/event-stream: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Error'}
  /devices:
    get:
      responses:
        '200':
          description: Active devices of the sole owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {type: string}
                        name: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /devices/{id}:
    delete:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '204': {description: Token revoked}
        '401': {$ref: '#/components/responses/Error'}
  /attachments/{id}:
    parameters:
      - {$ref: '#/components/parameters/Generation'}
      - in: path
        name: id
        required: true
        schema: {type: string, pattern: '^[a-f0-9]{64}$'}
    put:
      summary: Upload ciphertext (up to 301 MiB including encryption overhead), ID equals SHA-256 of the body
      description: User files are limited to 314572800 bytes before encryption. The transport permits 315621376 bytes including authenticated ciphertext overhead. Larger uploads return 413, including streamed requests without Content-Length. Original names and content hashes remain inside encrypted records.
      parameters:
        - in: header
          name: X-Yggvion-Encryption
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
          description: Workspace key fingerprint; must match /state.
      requestBody:
        required: true
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Stored id and size}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
    get:
      responses:
        '200':
          description: Private attachment
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  parameters:
    BackupID:
      in: path
      name: id
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{32}$'}
    Generation:
      in: header
      name: X-Yggvion-Generation
      required: true
      schema: {type: string}
      description: Always required; missing values or mismatches return 409 generation_changed
  securitySchemes:
    deviceToken: {type: http, scheme: bearer}
    calendarShare: {type: http, scheme: bearer, description: 256-bit share secret; one-hour lifetime}
  responses:
    Error:
      description: A stable error code without internal server details
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
  schemas:
    ServerMetrics:
      type: object
      required: [sampled_at, cpu_percent, memory_total_bytes, memory_used_bytes, process_memory_bytes, disk_total_bytes, disk_available_bytes, uptime_seconds]
      properties:
        sampled_at: {type: string, format: date-time}
        cpu_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
        memory_total_bytes: {type: integer, minimum: 0}
        memory_used_bytes: {type: integer, minimum: 0}
        process_memory_bytes: {type: integer, minimum: 0}
        disk_total_bytes: {type: integer, minimum: 0}
        disk_available_bytes: {type: integer, minimum: 0}
        uptime_seconds: {type: integer, minimum: 0}
    Backup:
      type: object
      required: [id, created, bytes, records, files, reason]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        created: {type: string, format: date-time}
        bytes: {type: integer, minimum: 0}
        records: {type: integer, minimum: 0}
        files: {type: integer, minimum: 0}
        reason: {type: string, enum: [manual, scheduled, before_restore, before_update, import]}
    BackupConfig:
      type: object
      additionalProperties: false
      required: [every_hours, keep_daily, keep_weekly]
      properties:
        every_hours: {type: integer, enum: [0, 6, 12, 24, 168], default: 24}
        keep_daily: {type: integer, minimum: 1, maximum: 90, default: 7}
        keep_weekly: {type: integer, minimum: 0, maximum: 52, default: 4}
    BackupRemote:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [disabled, s3, sftp]}
        endpoint: {type: string, description: 'HTTPS origin for S3 or host:port for SFTP'}
        bucket: {type: string}
        region: {type: string}
        prefix: {type: string, description: S3 prefix or absolute SFTP directory without dot segments}
        username: {type: string, description: S3 access key or SSH username}
        secret: {type: string, writeOnly: true}
        private_key: {type: string, writeOnly: true}
        fingerprint: {type: string, description: Exact OpenSSH SHA256 fingerprint for SFTP}
    Record:
      type: object
      required: [id, kind, version, deleted, data, seq]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,160}$'}
        kind: {type: string, enum: [task, block, session, note, note_folder, project, settings, series, snooze]}
        version: {type: integer, minimum: 0, description: '0 for creation, server increments on accepted change'}
        deleted: {type: boolean}
        seq: {type: integer, minimum: 0, description: Server change cursor}
        data: {$ref: '#/components/schemas/EncryptedEnvelope'}
    PasswordEnvelope:
      type: object
      additionalProperties: false
      required: [v, key_id, revision, kdf, memory, iterations, parallelism, salt, nonce, box, mac]
      description: Argon2id derives a 32-byte wrapping key from the user password and salt. AES-256-GCM wraps the random 32-byte workspace key. AAD binds the context, key fingerprint, revision, KDF parameters and salt; HMAC-SHA256 with the workspace key authenticates the complete wrapping for existing devices. Clients reject unsupported or excessive KDF parameters before deriving. Offline password guessing remains possible; use a strong passphrase.
      properties:
        v: {type: integer, const: 1}
        key_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        revision: {type: integer, minimum: 1, maximum: 2147483647}
        kdf: {type: string, const: argon2id}
        memory: {type: integer, const: 19456, description: KiB}
        iterations: {type: integer, const: 2}
        parallelism: {type: integer, const: 1}
        salt: {type: string, maxLength: 128, description: Base64 of 16 random bytes}
        nonce: {type: string, maxLength: 128, description: Base64 of 12 random bytes}
        box: {type: string, maxLength: 128, description: Base64 of 32 ciphertext bytes and 16-byte GCM tag}
        mac: {type: string, maxLength: 128, description: Base64 of 32-byte HMAC}
    EncryptedEnvelope:
      type: object
      additionalProperties: false
      required: [e2ee, key_id, nonce, box, files]
      properties:
        e2ee: {type: integer, const: 1}
        key_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        nonce: {type: string, description: Base64 of 12 random bytes}
        box: {type: string, description: Base64 AES-256-GCM ciphertext followed by 16-byte tag; authenticated payload contains local ID, data and attachment mapping}
        files:
          type: array
          maxItems: 10000
          items: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA256 of encrypted file, never of plaintext}
    Availability:
      type: object
      additionalProperties: false
      required: [timezone, busy]
      properties:
        timezone: {type: string, description: Owner IANA timezone}
        busy:
          type: array
          maxItems: 10000
          description: Sorted merged intervals within the share window, deliberately unencrypted. No titles or task IDs.
          items:
            type: object
            additionalProperties: false
            required: [start, end]
            properties:
              start: {type: string, format: date-time}
              end: {type: string, format: date-time}
    Task:
      type: object
      required: [title, description, project_id, status]
      properties:
        title: {type: string, minLength: 1, maxLength: 1000}
        description: {type: string, description: Markdown}
        project_id: {type: string, description: Empty string means no project}
        status: {type: string, enum: [todo, in_progress, waiting, done]}
        parent_id: {type: string}
        series_id: {type: string}
        occurrence: {type: string, description: Original occurrence in UTC; empty for nonrecurring task}
        birthday_date: {type: string, format: date, description: Optional birth date YYYY-MM-DD. Marks a birthday occurrence; excluded from planner and kanban. Managed through its annual series.}
        birthday_year: {type: integer, minimum: 1800, maximum: 9999, description: Calendar year of this birthday; completion is independent for each year.}
        proposal:
          type: object
          description: >-
            Optional guest suggestion. Pending tasks form a separate planner group
            and are excluded from kanban. Planning clears pending and creates a block
            with deterministic ID proposal_TASKID to prevent duplicates across devices.
            The original requested interval is retained as provenance.
          required: [pending, start, end, timezone]
          properties:
            pending: {type: boolean}
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
            timezone: {type: string}
    Block:
      type: object
      required: [task_id, start, end, timezone, all_day, historical, reminders]
      properties:
        task_id: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time, description: Exclusive end greater than start}
        timezone: {type: string, description: IANA timezone}
        all_day: {type: boolean}
        historical: {type: boolean, description: Retained in history and excluded from current estimate}
        reminder_at:
          type: array
          maxItems: 12
          items: {type: string, format: date-time}
          description: Optional absolute UTC reminder times. A nonempty array takes precedence over reminders. Birthdays have one notice at 09:00 in the application timezone on the birthday; legacy notices before that day are ignored by clients.
        reminders: {type: array, maxItems: 12, items: {type: integer, minimum: 0, maximum: 525600}}
    Session:
      type: object
      required: [task_id, device_id, start, end, discarded]
      properties:
        task_id: {type: string}
        device_id: {type: string}
        start: {type: string, format: date-time}
        end: {type: [string, 'null'], format: date-time, description: Null means running}
        discarded: {type: boolean, description: Original intervals retained after conflict resolution}
    Note:
      type: object
      required: [title, content, pinned]
      properties:
        title: {type: string, minLength: 1}
        content: {type: string, description: 'Markdown; attachments use attachment:SHA256 URLs, internal note links use note:ID and remain stable across renames. Task descriptions support the same links.'}
        pinned: {type: string, enum: ['', scratchpad, reference]}
        folder_id: {type: string, description: 'Optional note_folder ID. Empty or a removed folder is displayed as unfiled.'}
        sort_order: {type: integer, minimum: -10000000000000, maximum: 10000000000000, default: 0}
    NoteFolder:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 1000}
        sort_order: {type: integer, minimum: -10000000000000, maximum: 10000000000000, default: 0}
    Project:
      type: object
      required: [title, color]
      properties:
        title: {type: string, minLength: 1}
        color: {type: integer, minimum: 0, maximum: 4294967295, description: ARGB}
    Settings:
      type: object
      required: [default_minutes, reminders, timezone]
      properties:
        default_minutes: {type: integer, minimum: 5, maximum: 1440}
        reminders: {type: array, maxItems: 12, items: {type: integer, minimum: 0, maximum: 525600}}
        timezone: {type: string}
        task_color: {type: integer, nullable: true, minimum: 4278190080, maximum: 4294967295, default: 4288461311, description: 'Unified opaque ARGB application accent for controls, highlights, accent text and tasks without a project. The legacy JSON name is retained for compatibility. Omitted or null uses the default blue. Projects keep their own colors.'}
        search_typos: {type: integer, nullable: true, minimum: 0, maximum: 2, default: 1, description: 'Allowed typos per typed word prefix; the untyped suffix is ignored. A single character is always exact; two characters allow at most one typo. 0 disables fuzzy matching. Omitted or null defaults to 1. Notes precede tasks; within each type title matches precede body matches, with exact matches first within each group.'}
    Series:
      type: object
      required: [title, description, project_id, start, minutes, timezone, rule, reminders, all_day, exceptions]
      properties:
        birthday_date: {type: string, format: date, description: 'Optional birth date; title is the person''s name. Annual birthday tasks use deterministic IDs by series and year, compute age, and fall back to February 28 for leap-day birthdays in common years. Changing birth date preserves yearly completion.'}
        title: {type: string}
        description: {type: string}
        project_id: {type: string}
        start: {type: string, format: date-time}
        minutes: {type: integer, minimum: 1, maximum: 527040}
        timezone: {type: string}
        rule: {type: string, description: RFC5545 RRULE}
        reminders: {type: array, items: {type: integer}}
        all_day: {type: boolean}
        exceptions: {type: array, items: {type: string, format: date-time}}
        cancelled_from:
          type: string
          format: date-time
          nullable: true
          description: Inclusive UTC occurrence cutoff for explicit deletion of this and following tasks. Omitted/null for an active series; independent of RRULE UNTIL used when splitting a series. Server tombstones late offline occurrences and their blocks, sessions and snoozes.
        offset_minutes: {type: integer}
        anchor_timezone: {type: string, description: Immutable IANA timezone for original occurrence identities}
        day_span: {type: integer, minimum: 0, maximum: 366, description: Number of civil days for all-day recurrence}
    Snooze:
      type: object
      required: [task_id, at]
      properties:
        task_id: {type: string}
        at: {type: string, format: date-time}
